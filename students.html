<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Students | The Music Army</title>
  <style>
    :root { --navy:#1f2d3d; --canvas:#eaede9; --ink:#20272f; --muted:#748087; --line:#dde3df; --green:#29443a; --gold:#dcae50; --red:#a94f4f; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:1100px; min-height:100vh; font-family:Inter,system-ui,sans-serif; color:var(--ink); background:var(--canvas); }
    button,select,input,textarea { font:inherit; }
    .shell { display:grid; grid-template-columns:170px minmax(620px,1fr) 380px; min-height:100vh; }
    .sidebar { display:flex; flex-direction:column; min-height:100vh; padding:18px 16px 14px; color:#adbac3; background:var(--navy); }
    .brand { display:flex; align-items:center; gap:8px; min-height:42px; margin-bottom:24px; color:#fff; font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .brand img { width:34px; height:34px; object-fit:contain; }
    .side-nav { display:grid; gap:4px; }
    .side-nav a { display:flex; align-items:center; height:42px; border-radius:4px; padding:0 12px; color:#aebbc5; text-decoration:none; font-size:13px; }
    .side-nav a.active { color:#fff; background:#26394a; }
    main { background:#f2f4f1; }
    .topbar { height:118px; padding:26px 30px 18px; border-bottom:1px solid var(--line); background:#f8f9f7; }
    .topbar h1 { margin:4px 0 2px; font-size:25px; }
    .topbar p { margin:0; color:var(--muted); font-size:12px; }
    .admin-meta { color:var(--muted); font-size:11px; }
    .admin-meta strong { color:#35404a; }
    .content { padding:20px 30px 30px; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .filters { display:flex; gap:8px; }
    input,select { height:36px; border:1px solid #d8dedb; border-radius:3px; padding:0 10px; background:#fff; font-size:12px; }
    .filters input { width:190px; }
    .table-wrap { overflow:hidden; border:1px solid var(--line); border-radius:5px; background:#fff; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th { height:42px; padding:0 12px; color:#69727b; background:#f2f4f1; text-align:left; font-size:10px; }
    td { height:58px; padding:0 12px; border-top:1px solid #edf0ed; }
    tbody tr { cursor:pointer; }
    tbody tr:hover,tbody tr.selected { background:#f5f7f4; }
    .status { display:inline-block; border-radius:3px; padding:3px 7px; color:#5d6d62; background:#dfe8de; font-size:10px; }
    .status.attention { color:#8a651e; background:#f1dfb3; }
    .details { border-left:1px solid var(--line); background:#fbfbfa; }
    .detail-header { min-height:78px; display:flex; justify-content:space-between; padding:18px 20px 12px; }
    .detail-header h2 { margin:0 0 3px; font-size:20px; }
    .detail-kicker { color:#66716f; font-size:11px; }
    .detail-body { padding:0 20px 24px; }
    .program-box { border:1px solid var(--line); border-radius:4px; padding:12px; background:#fff; }
    .program-box label { display:block; margin-bottom:6px; color:var(--muted); font-size:10px; }
    .program-box select { width:100%; }
    .program-summary { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
    .program-stat { border-right:1px solid var(--line); }
    .program-stat:last-child { border-right:0; }
    .program-stat span { display:block; color:var(--muted); font-size:9px; }
    .program-stat strong { display:block; margin-top:3px; font-size:12px; }
    .validity { display:flex; justify-content:space-between; margin:12px 0; border:1px solid #ddd9c5; border-radius:4px; padding:9px 10px; background:#f5f1de; font-size:11px; }
    .validity strong { color:#80652c; }
    .schedule-head { display:flex; align-items:center; justify-content:space-between; margin:16px 0 8px; }
    .schedule-head h3 { margin:0; font-size:13px; }
    .schedule-head button { height:32px; border:1px solid #cfd6d2; border-radius:3px; background:#fff; font-size:10px; cursor:pointer; }
    .session-list { display:grid; gap:7px; }
    .session-row { display:grid; grid-template-columns:24px 1fr auto; align-items:center; gap:8px; min-height:48px; border:1px solid var(--line); border-radius:4px; padding:6px 8px; background:#fff; font-size:10px; }
    .session-number { display:grid; place-items:center; width:24px; height:24px; border-radius:50%; color:#fff; background:#71877e; font-size:9px; }
    .session-row.completed .session-number { background:#29443a; }
    .session-row.rescheduled .session-number { background:#b08a43; }
    .session-row strong { display:block; font-size:11px; }
    .session-row span { color:var(--muted); }
    .session-actions { display:flex; gap:4px; }
    .session-actions button { height:26px; border:1px solid #dce2de; border-radius:3px; background:#fff; font-size:9px; cursor:pointer; }
    .modal-backdrop { position:fixed; inset:0; z-index:50; display:none; place-items:center; background:rgba(18,29,38,.38); }
    .modal-backdrop.open { display:grid; }
    .modal { width:360px; border-radius:5px; padding:18px; background:#fff; box-shadow:0 18px 50px rgba(20,30,38,.24); }
    .modal h2 { margin:0 0 12px; font-size:17px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .field { display:grid; gap:5px; }
    .field label { color:var(--muted); font-size:10px; }
    .field input,.field textarea { width:100%; }
    .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
    .modal-actions button { height:34px; border:1px solid #d8dedb; border-radius:3px; padding:0 12px; background:#fff; font-size:11px; cursor:pointer; }
    .modal-actions .primary { border-color:var(--green); color:#fff; background:var(--green); }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><img src="Assets/Images/Logos/logo.png" alt=""><span>The Music Army</span></div>
      <nav class="side-nav" aria-label="Admin navigation">
        <a href="dashboard.html">Dashboard</a>
        <a href="admin.html">Bookings</a>
      </nav>
    </aside>
    <main>
      <header class="topbar">
        <div>
          <div class="admin-meta"><strong>Oshien Maboloc</strong> · Roving admin</div>
          <h1>Students</h1>
          <p>Manage programs, validity periods and individual lesson schedules.</p>
        </div>
      </header>
      <div class="content">
        <div class="toolbar">
          <div class="filters">
            <input id="search" type="search" placeholder="Search student or instrument" aria-label="Search students">
            <select id="programFilter" aria-label="Filter by program">
              <option value="All programs">All programs</option>
              <option>Infantry</option>
              <option>Basic Combat</option>
              <option>A-Team</option>
              <option>Special Forces</option>
            </select>
            <select id="branchFilter" aria-label="Filter by branch">
              <option value="All branches">All branches</option>
              <option>BGC</option>
              <option>Poblacion</option>
              <option>Acacia Town Center</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Student</th><th>Program</th><th>Instrument</th><th>Branch</th><th>Sessions</th><th>Status</th></tr></thead>
            <tbody id="studentRows"></tbody>
          </table>
        </div>
      </div>
    </main>
    <aside class="details" id="studentDetails"></aside>
  </div>
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <h2 id="modalTitle">Reschedule session</h2>
      <div class="form-grid">
        <div class="field"><label>New date</label><input id="newDate" type="date" value="2026-11-28"></div>
        <div class="field"><label>New time</label><select id="newTime"><option>10:00 AM</option><option>1:00 PM</option><option>4:00 PM</option></select></div>
      </div>
      <div class="modal-actions"><button type="button" id="closeModal">Cancel</button><button type="button" class="primary" id="saveSession">Save session</button></div>
    </div>
  </div>
  <script>
    const programData = {
      "Infantry": { sessions:6, validity:"1 month", frequency:"Twice a week" },
      "Basic Combat": { sessions:8, validity:"1 month", frequency:"Twice a week" },
      "A-Team": { sessions:15, validity:"5 weeks", frequency:"Three times a week" },
      "Special Forces": { sessions:24, validity:"3 months", frequency:"Twice a week" }
    };

    const students = [
      { id:1, name:"Ana Cruz", program:"Infantry", instrument:"Piano", branch:"Poblacion", completed:2, start:"Nov 2, 2026", end:"Dec 2, 2026", status:"On schedule", sessionOverrides:{}, extraSessions:0 },
      { id:2, name:"Carl Reyes", program:"Basic Combat", instrument:"Guitar", branch:"BGC", completed:5, start:"Nov 6, 2026", end:"Dec 6, 2026", status:"On schedule", sessionOverrides:{}, extraSessions:0 },
      { id:3, name:"Ella Uy", program:"A-Team", instrument:"Vocals", branch:"Acacia Town Center", completed:8, start:"Oct 20, 2026", end:"Nov 24, 2026", status:"Needs attention", sessionOverrides:{}, extraSessions:0 },
      { id:4, name:"Miguel Tan", program:"Special Forces", instrument:"Drums", branch:"Poblacion", completed:12, start:"Sep 1, 2026", end:"Dec 1, 2026", status:"On schedule", sessionOverrides:{}, extraSessions:0 },
      { id:5, name:"Sofia Lim", program:"Basic Combat", instrument:"Bass", branch:"BGC", completed:3, start:"Nov 10, 2026", end:"Dec 10, 2026", status:"On schedule", sessionOverrides:{}, extraSessions:0 }
    ];

    let selectedId = 1;
    let activeSession = null;
    const rows = document.getElementById("studentRows");
    const details = document.getElementById("studentDetails");

    function sessionsFor(student) {
      const total = programData[student.program].sessions + (student.extraSessions || 0);
      return Array.from({ length: total }, (_, index) => {
        const dayOffset = index * (student.program === "A-Team" ? 2 : 3);
        const date = new Date("2026-11-03T12:00:00");
        date.setDate(date.getDate() + dayOffset);
        const override = student.sessionOverrides[index + 1];
        return {
          number:index + 1,
          date:override?.date || date.toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }),
          time:override?.time || (index % 2 ? "1:00 PM" : "10:00 AM"),
          status:index < student.completed ? "Completed" : index === student.completed ? "Upcoming" : "Scheduled"
        };
      });
    }

    function renderRows() {
      const search = document.getElementById("search").value.toLowerCase();
      const program = document.getElementById("programFilter").value;
      const branch = document.getElementById("branchFilter").value;
      const filtered = students.filter((student) => {
        return (!search || `${student.name} ${student.instrument}`.toLowerCase().includes(search)) &&
          (program === "All programs" || student.program === program) &&
          (branch === "All branches" || student.branch === branch);
      });
      rows.innerHTML = filtered.map((student) => {
        const total = programData[student.program].sessions;
        return `<tr data-id="${student.id}" class="${student.id === selectedId ? "selected" : ""}">
          <td><strong>${student.name}</strong></td>
          <td>${student.program}</td>
          <td>${student.instrument}</td>
          <td>${student.branch}</td>
          <td>${student.completed}/${total}</td>
          <td><span class="status ${student.status === "Needs attention" ? "attention" : ""}">${student.status}</span></td>
        </tr>`;
      }).join("");
    }

    function renderDetails() {
      const student = students.find((item) => item.id === selectedId) || students[0];
      const program = programData[student.program];
      const sessions = sessionsFor(student);
      details.innerHTML = `
        <div class="detail-header"><div><div class="detail-kicker">Student record</div><h2>${student.name}</h2></div></div>
        <div class="detail-body">
          <div class="program-box">
            <label>Program</label>
            <select id="programSelect">
              ${Object.keys(programData).map((name) => `<option ${name === student.program ? "selected" : ""}>${name}</option>`).join("")}
            </select>
            <div class="program-summary">
              <div class="program-stat"><span>Sessions</span><strong>${program.sessions}</strong></div>
              <div class="program-stat"><span>Frequency</span><strong>${program.frequency}</strong></div>
              <div class="program-stat"><span>Validity</span><strong>${program.validity}</strong></div>
            </div>
          </div>
          <div class="validity"><span>Validity period</span><strong>${student.start} – ${student.end}</strong></div>
          <div class="schedule-head">
            <h3>Session schedule</h3>
            <button type="button" id="addSession">Add session</button>
          </div>
          <div class="session-list">
            ${sessions.map((session) => `
              <div class="session-row ${session.status === "Completed" ? "completed" : ""}">
                <div class="session-number">${session.number}</div>
                <div><strong>${session.date} · ${session.time}</strong><span>${session.status}</span></div>
                <div class="session-actions">
                  ${session.status !== "Completed" ? `<button type="button" data-complete="${session.number}">Complete</button>` : ""}
                  <button type="button" data-reschedule="${session.number}">Reschedule</button>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;

      document.getElementById("programSelect").addEventListener("change", (event) => {
        student.program = event.target.value;
        student.completed = Math.min(student.completed, programData[student.program].sessions);
        const base = new Date("2026-11-24T12:00:00");
        const validity = programData[student.program].validity;
        if (validity === "1 month") base.setMonth(base.getMonth() + 1);
        if (validity === "5 weeks") base.setDate(base.getDate() + 35);
        if (validity === "3 months") base.setMonth(base.getMonth() + 3);
        student.start = "Nov 24, 2026";
        student.end = base.toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" });
        student.extraSessions = 0;
        student.sessionOverrides = {};
        renderRows();
        renderDetails();
      });

      document.getElementById("addSession").addEventListener("click", () => {
        student.extraSessions = (student.extraSessions || 0) + 1;
        renderDetails();
      });

      details.querySelectorAll("[data-complete]").forEach((button) => {
        button.addEventListener("click", () => {
          const number = Number(button.dataset.complete);
          if (number > student.completed) student.completed = number;
          renderRows();
          renderDetails();
        });
      });

      details.querySelectorAll("[data-reschedule]").forEach((button) => {
        activeSession = Number(button.dataset.reschedule);
        button.addEventListener("click", () => openModal(activeSession));
      });
    }

    function openModal(number) {
      activeSession = number;
      document.getElementById("modalTitle").textContent = `Reschedule session ${number}`;
      document.getElementById("modalBackdrop").classList.add("open");
    }

    document.getElementById("closeModal").addEventListener("click", () => document.getElementById("modalBackdrop").classList.remove("open"));
    document.getElementById("saveSession").addEventListener("click", () => {
      const student = students.find((item) => item.id === selectedId);
      const dateValue = document.getElementById("newDate").value;
      const time = document.getElementById("newTime").value;
      const date = new Date(`${dateValue}T12:00:00`);
      student.sessionOverrides[activeSession] = {
        date:date.toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }),
        time
      };
      document.getElementById("modalBackdrop").classList.remove("open");
      renderDetails();
    });

    rows.addEventListener("click", (event) => {
      const row = event.target.closest("tr[data-id]");
      if (!row) return;
      selectedId = Number(row.dataset.id);
      renderRows();
      renderDetails();
    });
    ["search","programFilter","branchFilter"].forEach((id) => {
      document.getElementById(id).addEventListener(id === "search" ? "input" : "change", renderRows);
    });

    renderRows();
    renderDetails();
  </script>
</body>
</html>
